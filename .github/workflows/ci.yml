name: CI

on:
  push:
    branches: [main, master]
    # A tag push additionally drives the release-* jobs below (see specs/012-release-pipeline-automation) —
    # android/ios below run unchanged either way, the release jobs' `needs:` is what enforces
    # FR-005 (never release a commit that hasn't passed them).
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Builds every module buildable on Linux (Android targets + JVM/common code),
      # runs lint and host unit tests. iOS native compile tasks are automatically
      # skipped on this host — they're covered by the ios job below.
      - name: Build, lint and unit test
        run: ./gradlew build --stacktrace

      # See specs/005-static-analysis-ci/. Fails only on issues newer than each module's
      # committed detekt-baseline.xml — pre-existing debt is baselined, not a CI blocker.
      - name: Static analysis (detekt)
        run: ./gradlew detekt --stacktrace

      # build-logic is a separate Gradle build (an includeBuild), so its own detekt task
      # isn't reached by the root `./gradlew detekt` above (specs/005-static-analysis-ci/quickstart.md §1).
      - name: Static analysis (detekt) — build-logic
        run: ./gradlew -p build-logic detekt --stacktrace

      # specs/014-code-coverage-tooling. A distinct step after the tests above, not a
      # continuation of `build`, so a broken test still fails at the "Build, lint and unit
      # test" step and this step (and the artifact below) simply doesn't run for that
      # commit — coverage generation failing never masks a test failure (FR-007).
      - name: Code coverage report (Kover)
        run: ./gradlew koverHtmlReport koverXmlReport --stacktrace

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/kover/html

  ios:
    name: iOS (KMP) native compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compiles the iosArm64/iosSimulatorArm64 Kotlin/Native targets for every KMP
      # module. Uses the simulator arm64 framework link task (no code signing needed)
      # rather than a full `xcodebuild` of iosApp.xcodeproj, so this job stays free of
      # provisioning-profile/signing setup while still catching iOS-breaking Kotlin
      # changes. A full Xcode build can be layered on top later if needed.
      - name: Compile iOS targets
        run: ./gradlew linkDebugFrameworkIosSimulatorArm64 --stacktrace

  # --- Release pipeline (specs/012-release-pipeline-automation) ---
  # Triggered only by a `vMAJOR.MINOR.PATCH` tag push (never a branch push or PR — FR-004).
  # `needs: [android, ios]` on release-version is what guarantees FR-005: these jobs cannot
  # start unless the same commit already passed build/lint/test/detekt above.

  release-version:
    name: Release — derive version
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      versionName: ${{ steps.version.outputs.versionName }}
      versionCode: ${{ steps.version.outputs.versionCode }}
    steps:
      - uses: actions/checkout@v4

      # research.md D2: versionCode = MAJOR*1_000_000 + MINOR*1_000 + PATCH — strictly
      # increasing for increasing semver, so Play Store/App Store Connect order releases
      # correctly (FR-003).
      - name: Derive versionName/versionCode from the tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER="${TAG#v}"
          if [[ ! "$SEMVER" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' isn't a plain vMAJOR.MINOR.PATCH (got '$SEMVER')."
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "versionName=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      # research.md D6 (FR-008): never let a re-pushed tag silently duplicate a release.
      - name: Guard against re-releasing an existing version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::A release for ${GITHUB_REF_NAME} already exists — refusing to duplicate it."
            exit 1
          fi

  release-android:
    name: Release — Android (signed AAB)
    needs: release-version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # research.md D4 (FR-006): fail with a message naming the missing secret, before ever
      # invoking Gradle/jarsigner with an incomplete signing config.
      - name: Verify Android signing secrets are configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -z "$ANDROID_KEYSTORE_BASE64" ]] && missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -z "$ANDROID_KEYSTORE_PASSWORD" ]] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -z "$ANDROID_KEY_ALIAS" ]] && missing+=("ANDROID_KEY_ALIAS")
          [[ -z "$ANDROID_KEY_PASSWORD" ]] && missing+=("ANDROID_KEY_PASSWORD")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required secret(s) for Android release signing: ${missing[*]}"
            exit 1
          fi

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # AGP's injected signing properties (android.injected.signing.*) sign the release
      # bundle without needing a custom signingConfig block in composeApp/build.gradle.kts —
      # nothing about the keystore/passwords ever touches a Gradle file. Passed via env: (not
      # interpolated directly into the command) so a password containing shell metacharacters
      # can't corrupt the invocation.
      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:bundleRelease --stacktrace \
            -PreleaseVersionName=${{ needs.release-version.outputs.versionName }} \
            -PreleaseVersionCode=${{ needs.release-version.outputs.versionCode }} \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Publish AAB to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber \
            composeApp/build/outputs/bundle/release/composeApp-release.aab

  release-ios:
    name: Release — iOS (TestFlight-ready archive)
    needs: release-version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # research.md D4 (FR-006): same guarantee as release-android, iOS side.
      - name: Verify iOS signing secrets are configured
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=()
          [[ -z "$IOS_CERTIFICATE_BASE64" ]] && missing+=("IOS_CERTIFICATE_BASE64")
          [[ -z "$IOS_CERTIFICATE_PASSWORD" ]] && missing+=("IOS_CERTIFICATE_PASSWORD")
          [[ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]] && missing+=("IOS_PROVISIONING_PROFILE_BASE64")
          [[ -z "$IOS_TEAM_ID" ]] && missing+=("IOS_TEAM_ID")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required secret(s) for iOS release signing: ${missing[*]}"
            exit 1
          fi

      # Standard "temporary keychain" pattern for unattended codesign in CI. Not exercisable
      # in this environment (no real certificate/profile) — verify against quickstart.md
      # with real secrets before relying on it (specs/012-release-pipeline-automation).
      - name: Import signing certificate and provisioning profile
        id: signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/release-cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/release.mobileprovision"

          echo "$IOS_CERTIFICATE_BASE64" | base64 -d -o "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" "$(security list-keychains -d user | sed 's/"//g')"

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/release.mobileprovision

          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          echo "keychainPath=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "profileName=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      # research.md D3: uses the shared scheme committed at
      # iosApp.xcodeproj/xcshareddata/xcschemes/iosApp.xcscheme — xcuserdata schemes aren't
      # in git and wouldn't exist on this runner. MARKETING_VERSION/CURRENT_PROJECT_VERSION
      # override iosApp/Configuration/Config.xcconfig's defaults for this build only.
      - name: Archive
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            MARKETING_VERSION=${{ needs.release-version.outputs.versionName }} \
            CURRENT_PROJECT_VERSION=${{ needs.release-version.outputs.versionCode }} \
            "TEAM_ID=$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual

      # PRODUCT_BUNDLE_IDENTIFIER (Config.xcconfig) is itself TEAM_ID-dependent
      # ("com.connectapp.physioapp.PhysioApp$(TEAM_ID)"), so ExportOptions.plist's
      # `provisioningProfiles` dict key can only be computed here, not templated as a
      # placeholder (see the comment in iosApp/ExportOptions.plist).
      - name: Export .ipa for TestFlight
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profileName }}
        run: |
          BUNDLE_ID="com.connectapp.physioapp.PhysioApp${IOS_TEAM_ID}"
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cp iosApp/ExportOptions.plist "$EXPORT_OPTIONS"
          sed -i '' "s/__IOS_TEAM_ID__/${IOS_TEAM_ID}/" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" "$EXPORT_OPTIONS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

      - name: Publish .ipa to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" --generate-notes || true
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber "$IPA_PATH"

      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "${{ steps.signing.outputs.keychainPath }}" || true
