#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#specs/008-014 added 8 more iOS-targeting modules; building the Kotlin/Native compiler cache for
#large transitive klibs (e.g. material-icons-extended) across all of them now OOMs even a 12GB
#Gradle daemon heap ("Failed to build cache for .../material-icons-extended.klib"). Kotlin's own
#suggested workaround for this exact error is to disable the compiler cache: https://kotl.in/disable-native-cache
kotlin.native.cacheKind=none

#Gradle
#4096M was enough before specs/011-crash-analytics-reporting added sentry-android — its bundled
#native libraries push :composeApp:packageDebug past that ceiling with an OutOfMemoryError.
#6144M was in turn not enough once specs/008-014 added 8 more iOS-targeting modules (core:*,
#data:analytics, feature:edit_profile, feature:privacy_policy): Kotlin/Native linking runs
#in-process inside this same Gradle daemon JVM (see KotlinNativeToolRunner.runInProcess), so the
#extra linkDebug/ReleaseFramework tasks across those modules now OOM here, not in a Kotlin daemon.
org.gradle.jvmargs=-Xmx12288M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

